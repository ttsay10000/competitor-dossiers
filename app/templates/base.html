<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Hosted editorial serif font (EB Garamond as Minion-style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- If you have an Adobe Fonts kit for Minion Pro, replace the href below with your kit URL -->
  <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css"> -->
  <title>Competitor Signals</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #555555;
      --accent: #1f5b4f;
      --border: #d0d0d0;
      --border-color: #dee2e6;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Minion Pro", "Minion", "EB Garamond", "Georgia", "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    h1, h2, h3, h4 {
      font-family: "Minion Pro", "Minion", "EB Garamond", "Georgia", "Times New Roman", serif;
      color: var(--text);
      margin: 0 0 8px 0;
      letter-spacing: 0.02em;
    }

    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
    h4 { font-size: 15px; font-weight: 600; }

    p {
      margin: 0 0 8px 0;
    }

    ul {
      margin: 0 0 8px 1.25rem;
      padding: 0;
    }

    li {
      margin-bottom: 4px;
    }

    .card > strong:first-of-type {
      display: block;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-section-title {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 4px 0 2px 0;
      letter-spacing: 0.03em;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
    }
    .header-left {
      display: flex;
      flex-direction: column;
    }
    nav a {
      margin-right: 16px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    nav a:last-child { margin-right: 0; }
    a { color: var(--text); text-decoration: underline; }
    a:hover { color: var(--accent); }
    nav a { text-decoration: none; }
    main {
      max-width: 1100px;
      margin: 24px auto 64px;
      padding: 0 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .card.sev-high { border-left: 6px solid #b84a2b; }
    .card.sev-med { border-left: 6px solid #b08a1d; }
    .card.sev-low { border-left: 6px solid #2f6b4f; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #efe9e2;
      color: #403d39;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .pill.high { background: #f7d7c4; color: #7a2d1a; }
    .pill.med { background: #f3e8c8; color: #735b18; }
    .pill.low { background: #e2f0e8; color: #20523e; }
    .meta {
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      margin-top: 6px;
    }
    /* Staffing/talent snapshot: consistent 13px body so list items match descriptions */
    .staffing-body { font-size: 13px; line-height: 1.4; color: var(--text); margin: 0; }
    .staffing-body.muted { color: var(--muted); }
    .staffing-body strong { font-weight: 600; font-size: inherit; }
    .staffing-list { margin: 0; padding-left: 20px; list-style: disc; }
    .staffing-list li { font-size: 13px; line-height: 1.4; margin-bottom: 2px; }
    .staffing-list li strong { font-weight: 600; font-size: inherit; }
    .staffing-total { font-size: 13px; line-height: 1.4; color: var(--muted); margin: 0 0 10px 0; }
    .empty {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      width: 100%;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    /* Spacing utilities (4/8/12/16/24px scale) */
    .mb-4 { margin-bottom: 4px; }
    .mb-6 { margin-bottom: 6px; }
    .mb-8 { margin-bottom: 8px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-24 { margin-bottom: 24px; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .pt-12 { padding-top: 12px; }
    /* Breadcrumb */
    .breadcrumb {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { color: var(--text); }
    /* Dossier: card meta spacing, list density */
    .card .meta.card-desc { margin-bottom: 12px; margin-top: 4px; }
    .card ul.card-list { margin: 0; padding-left: 20px; }
    .card ul.card-list li { margin-bottom: 6px; line-height: 1.5; }
    /* Page header with actions */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin: 0; }
    /* Jump-to nav (sticky, dossier): prevent scroll from going past the section header */
    .dossier-section { scroll-margin-top: 1.25rem; }
    .dossier-layout { display: flex; gap: 32px; align-items: flex-start; }
    .dossier-nav {
      flex-shrink: 0;
      width: 180px;
      position: sticky;
      top: 100px;
    }
    .dossier-nav-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .dossier-nav ul { margin: 0; padding: 0; list-style: none; }
    .dossier-nav li { margin-bottom: 4px; }
    .dossier-nav a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .dossier-nav a:hover { color: var(--accent); }
    .dossier-content { flex: 1; min-width: 0; }
    @media (max-width: 900px) {
      .dossier-layout { flex-direction: column; }
      .dossier-nav { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 8px; }
      .dossier-nav-title { width: 100%; }
      .dossier-nav ul { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    }
    /* Channel status pills */
    .channel-pills { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .channel-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      background: #f0f0f0;
      color: var(--muted);
    }
    .channel-pill.has { background: #e2f0e8; color: #20523e; }
    .channel-pill.running { background: #fef9e6; color: #7d6a00; }
    .channel-pill.error { background: #f8d7da; color: #721c24; }
    .channel-pill-timer { font-size: 11px; opacity: 0.9; margin-left: 2px; }
    .refresh-card-sections { display: flex; flex-direction: column; gap: 20px; margin-top: 12px; }
    .refresh-section { }
    .refresh-section-reset { padding-top: 16px; border-top: 1px solid var(--border); }
    .run-channels-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    .run-channels-checkboxes { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .run-channels-checkboxes label { display: inline-flex; align-items: center; gap: 4px; }
    .reset-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .refresh-status-msg { font-weight: 500; }
    @media (max-width: 700px) {
      header { flex-direction: column; align-items: center; gap: 8px; }
      main { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <strong>Competitor Signals</strong>
      <span class="meta" style="display: block; margin-top: 4px;">
        Data last refreshed: {% if last_refreshed %}{{ last_refreshed | to_eastern }}{% else %}—{% endif %}
      </span>
    </div>
    <nav style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
      <a href="/competitors">Home</a>
      <a href="/digest">Dashboard</a>
      <a href="/runs">Runs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="meta" style="text-align: center; padding: 16px; margin-top: 24px; border-top: 1px solid var(--border);">
    Page generated: {{ etnow() }}
  </footer>
</body>
</html>
