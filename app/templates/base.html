<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Hosted editorial serif font (EB Garamond as Minion-style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- If you have an Adobe Fonts kit for Minion Pro, replace the href below with your kit URL -->
  <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css"> -->
  <title>Competitor Signals</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #555555;
      --accent: #1f5b4f;
      --border: #d0d0d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Minion Pro", "Minion", "EB Garamond", "Georgia", "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    h1, h2, h3, h4 {
      font-family: "Minion Pro", "Minion", "EB Garamond", "Georgia", "Times New Roman", serif;
      color: var(--text);
      margin: 0 0 8px 0;
      letter-spacing: 0.02em;
    }

    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; }
    h4 { font-size: 15px; font-weight: 600; }

    p {
      margin: 0 0 8px 0;
    }

    ul {
      margin: 0 0 8px 1.25rem;
      padding: 0;
    }

    li {
      margin-bottom: 4px;
    }

    .card > strong:first-of-type {
      display: block;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-section-title {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 4px 0 2px 0;
      letter-spacing: 0.03em;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
    }
    .header-left {
      display: flex;
      flex-direction: column;
    }
    nav a {
      margin-right: 16px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    nav a:last-child { margin-right: 0; }
    a { color: var(--text); text-decoration: underline; }
    a:hover { color: var(--accent); }
    nav a { text-decoration: none; }
    main {
      max-width: 1100px;
      margin: 24px auto 64px;
      padding: 0 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .card.sev-high { border-left: 6px solid #b84a2b; }
    .card.sev-med { border-left: 6px solid #b08a1d; }
    .card.sev-low { border-left: 6px solid #2f6b4f; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #efe9e2;
      color: #403d39;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .pill.high { background: #f7d7c4; color: #7a2d1a; }
    .pill.med { background: #f3e8c8; color: #735b18; }
    .pill.low { background: #e2f0e8; color: #20523e; }
    .meta {
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      margin-top: 6px;
    }
    .empty {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      width: 100%;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    @media (max-width: 700px) {
      header { flex-direction: column; align-items: center; gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <strong>Competitor Signals</strong>
      <span class="meta" style="display: block; margin-top: 4px;">
        Data last refreshed: {% if last_refreshed %}{{ last_refreshed.strftime('%Y-%m-%d %H:%M') }} UTC{% else %}—{% endif %}
      </span>
    </div>
    <nav style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
      <a href="/competitors">Dossiers</a>
      <a href="/runs">Runs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="meta" style="text-align: center; padding: 16px; margin-top: 24px; border-top: 1px solid var(--border);">
    Page generated: {{ utcnow().strftime('%Y-%m-%d %H:%M') }} UTC
  </footer>
</body>
</html>
