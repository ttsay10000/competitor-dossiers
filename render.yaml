# Render Blueprint: web app + cron. Uses Docker so Playwright + Chromium are available (Lark/AvantStay talent).
# Set PLAYWRIGHT_ENABLED=true for both services in the Dashboard (or env group). Link Postgres so DATABASE_URL is set.

services:
  # Web service (FastAPI). Docker build installs Playwright + Chromium so JS-rendered pages can be fetched if needed.
  - type: web
    name: competitor-dossiers
    runtime: docker
    dockerCommand: sh -c "python -m alembic upgrade head 2>/dev/null || true && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health

  # Cron: full refresh (talent, asset, press, homepage, public_records). Same image has Playwright for Lark/AvantStay talent.
  - type: cron
    name: competitor-signals-collect
    runtime: docker
    schedule: "0 2 * * 0"
    dockerCommand: python -m app.cli --channel all

  # Optional: asset-only cron. Uncomment to use.
  # - type: cron
  #   name: competitor-signals-asset
  #   runtime: docker
  #   schedule: "0 3 * * 0"
  #   dockerCommand: python -m app.cli --channel asset
