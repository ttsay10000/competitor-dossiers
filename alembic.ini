[alembic]
script_location = app/migrations
# Not used at runtime: env.py uses app.config.settings.database_url (postgresql+psycopg)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/competitor_signals

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
